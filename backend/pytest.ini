[pytest]
pythonpath = .
testpaths = tests
norecursedirs = AI_tests
addopts = --tb=short --disable-warnings

# Tests carrying the `ai` marker are skipped unless --run-ai is passed. Anything
# under tests/integration/AI/ gets the marker automatically; see tests/conftest.py
# and tests/README.md.
markers =
    ai: calls the live Gemini API (billed) and writes rows that are never rolled back. Opt in with --run-ai.
junit_family = xunit2

