name: test

# Runs the three existing suites on every push and PR.

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: admin (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trueswing_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: trueswing_admin/package-lock.json
      - run: npm ci
      - run: npm run test

  expo:
    name: expo (typecheck + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TrueSwing-expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: TrueSwing-expo-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Runs against a throwaway local Supabase built from supabase/migrations/, NOT the
  # remote project. Consequences worth knowing:
  #   - no secrets: the local stack ships fixed, publicly documented demo credentials
  #   - no concurrency group: each run gets its own database, so nothing to serialize
  #   - every run applies all migrations to a clean Postgres, so this doubles as the
  #     migration test (FK swaps, renames, ordering) that nothing else covers
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # config.toml keeps only db + auth + api enabled. auth is required because
      # tests/conftest.py creates real GoTrue users; api because
      # tests/integration/test_content_rls.py probes PostgREST with the anon key.
      - name: start local supabase
        run: supabase start

      - name: pytest
        # These must be REPOSITORY SECRETS (Settings > Secrets and variables > Actions >
        # Secrets tab), not Variables. `${{ secrets.X }}` and `${{ vars.X }}` read
        # different stores, and a missing secret renders as an empty string rather than
        # failing — which surfaces as an obscure downstream error like
        # "ValueError: Invalid endpoint:" instead of anything naming the real cause.
        # Secrets are also masked in logs; Variables are printed in plain text.
        #
        # Only what the suite genuinely needs. Everything else config.py reads uses
        # os.getenv and degrades to None, which the tests tolerate. Supabase comes from
        # the local stack, not from secrets.
        env:
          # Forces the SANDBOX Stripe path. Without it, config.py computes DEV=False and
          # reaches for LIVE_STRIPE_SECRET_KEY — CI must never touch live Stripe.
          DEV: 'TRUE'
          # Only used to build Stripe's success_url. The checkout test never completes a
          # payment, so any well-formed URL works; it just cannot be empty, or Stripe
          # rejects the session with "An explicit scheme (such as https) must be provided".
          VITE_API_URL: 'https://example.com'

          # R2: config.py reads these with os.environ[...] rather than os.getenv, so a
          # missing value raises at import and NOT ONE of the 648 tests runs.
          # 31 tests exercise real uploads (test_r2_adaptor, test_analysis, …).
          S3_API: ${{ secrets.S3_API }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

          # Stripe sandbox. core/infrastructure/payment/stripe/client.py builds the client
          # at module import, so a missing key breaks collection of the billing tests.
          # test_start_checkout_success additionally makes a real sandbox API call — it
          # asserts the returned URL starts with https://checkout.stripe.com/.
          SANDBOX_STRIPE_SECRET_KEY: ${{ secrets.SANDBOX_STRIPE_SECRET_KEY }}
          SANDBOX_STRIPE_PRICE_ID: ${{ secrets.SANDBOX_STRIPE_PRICE_ID }}
        run: |
          # A missing secret renders as an empty string rather than failing, so without
          # this the symptom is "ValueError: Invalid endpoint:" from inside botocore,
          # three layers from the cause. Fail here instead, naming the variable.
          missing=""
          for v in S3_API CLOUDFLARE_R2_ACCESS_KEY CLOUDFLARE_R2_SECRET_ACCESS_KEY \
                   SANDBOX_STRIPE_SECRET_KEY SANDBOX_STRIPE_PRICE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Empty or unset:$missing — add them under Settings > Secrets and variables > Actions > Secrets (NOT Variables; those are read via vars.* and are not masked in logs)."
            exit 1
          fi

          eval "$(supabase status -o env)"
          export DATABASE_URL="$DB_URL"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLL_KEY="$SERVICE_ROLE_KEY"
          # AI tests stay skipped without --run-ai (billed Gemini calls,
          # unrolled-back writes). See backend/tests/conftest.py.
          pytest
