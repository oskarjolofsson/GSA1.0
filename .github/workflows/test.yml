name: test

# Runs the three existing suites on every push and PR.

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: admin (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trueswing_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: trueswing_admin/package-lock.json
      - run: npm ci
      - run: npm run test

  expo:
    name: expo (typecheck + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TrueSwing-expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: TrueSwing-expo-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Runs against a throwaway local Supabase built from supabase/migrations/, NOT the
  # remote project. Consequences worth knowing:
  #   - no secrets: the local stack ships fixed, publicly documented demo credentials
  #   - no concurrency group: each run gets its own database, so nothing to serialize
  #   - every run applies all migrations to a clean Postgres, so this doubles as the
  #     migration test (FK swaps, renames, ordering) that nothing else covers
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # config.toml keeps only db + auth + api enabled. auth is required because
      # tests/conftest.py creates real GoTrue users; api because
      # tests/integration/test_content_rls.py probes PostgREST with the anon key.
      - name: start local supabase
        run: supabase start

      - name: pytest
        # Only these three are real secrets. core/config.py reads them with
        # os.environ[...] rather than os.getenv, so a missing value raises at import
        # and no test runs at all. They live in GitHub's encrypted secret store —
        # the lines below are references, never values, and GitHub masks them in logs.
        #
        # Everything else config.py reads uses os.getenv and degrades to None, which
        # the suite tolerates: Stripe, RevenueCat and Gemini are all either mocked or
        # gated. Supabase comes from the local stack below, not from secrets.
        env:
          S3_API: ${{ secrets.S3_API }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          eval "$(supabase status -o env)"
          export DATABASE_URL="$DB_URL"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLL_KEY="$SERVICE_ROLE_KEY"
          # AI tests stay skipped without --run-ai (billed Gemini calls,
          # unrolled-back writes). See backend/tests/conftest.py.
          pytest
